<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" width="1320" height="860" role="img" aria-label="proxy-monster on AWS: clients reach an internal ALB and NLB in your VPC; ECS services decide per statement in the control plane and query the target DB with a credential the bootstrap Lambda provisioned.">
