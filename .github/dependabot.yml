# `prefix` makes the PR title conventional; Dependabot's own "Bump x from a to b" fails the title check.
# `cooldown` must stay a sibling of commit-message; nested, Dependabot ignores it silently.
version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /
      - /modules/bootstrap-reader
      - /examples/*
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      terraform:
        patterns: ["*"]
        update-types: [minor, patch]

  # A uv.lock bump leaves requirements.txt stale; CI fails until `uv export` is rerun on the branch.
  - package-ecosystem: uv
    directory: /bootstrap
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      bootstrap:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 3
